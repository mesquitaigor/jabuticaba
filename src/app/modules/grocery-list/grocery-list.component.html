<div class="p-4 max-w-4xl mx-auto">
  <!-- Header Section -->
  <div
    class="flex items-center justify-between mb-3 border-b border-gray-200 pb-4"
  >
    <h1 class="text-xl font-bold text-gray-800">Seus itens</h1>
    <div class="flex gap-2">
      <p-button
        [icon]="showAllItems() ? 'pi pi-eye-slash' : 'pi pi-eye'"
        [jbtDataTestid]="testIds.VisibilityOffIcon"
        severity="secondary"
        (onClick)="onShowAllItems()"
      />
      <p-button icon="pi pi-plus" severity="primary" (onClick)="onAdd()" />
    </div>
  </div>

  <!-- Items List -->
  <div
    class="bg-white rounded-lg absolute w-full left-0 px-4"
    [class.fade-in]="!loading"
  >
    @if (isRefreshing) {
      <div
        [jbtDataTestid]="testIds.RefreshingBanner"
        class="flex items-center gap-2 text-sm text-blue-600 bg-blue-50 border border-blue-200 rounded-md px-3 py-2 mb-3"
      >
        <i class="pi pi-sync pi-spin"></i>
        <span>Atualizando dados...</span>
      </div>
    }
    @for (item of groceryItems(); track item.uuid) {
      @if (!loading) {
        <jbt-grocery-list-item
          [jbtDataTestid]="testIds.Item"
          [item]="item"
        ></jbt-grocery-list-item>
      }
    }

    <div
      class="p-8 text-center text-gray-500 absolute w-full left-0 top-0 flex flex-col items-center gap-3"
      [jbtDataTestid]="testIds.LoadingState"
      [class.fade-out]="!loading"
    >
      <jbt-loading />
      <p>Carregando</p>
    </div>
    @if (!loading && hasError) {
      <jbt-error-list-state
        [jbtDataTestid]="testIds.ErrorState"
        (reloadList)="loadItems()"
      ></jbt-error-list-state>
    } @else if (!loading && groceryItems().length === 0) {
      <jbt-empty-list-state
        [jbtDataTestid]="testIds.EmptyState"
      ></jbt-empty-list-state>
    }
  </div>
</div>
@if (hasItemsToBuy()) {
  <div class="fixed bottom-6 left-4 right-4">
    <p-button
      label="Modo compras"
      icon="pi pi-shopping-cart"
      severity="primary"
      styleClass="w-full !rounded-lg"
      (onClick)="onOpenShoppingMode()"
    />
  </div>
}
<p-toast />
